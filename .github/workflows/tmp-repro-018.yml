name: Throwaway repro — backlog item 018

# Temporary, throwaway workflow used to investigate backlog item 018
# (flaky buttons visual baseline) directly on the real ubuntu-24.04 CI
# runner — the only environment this repo's visual baselines are ever
# trusted from (.vibe/decisions/015). Deleted once 018 is resolved.
#
# Final step of the investigation: confirms the regenerated
# `section-buttons` baseline now committed passes the *whole* visual
# suite cleanly (not just that one section) on the real runner.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-full-visual-suite:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Visual regression tests (no update — must pass against committed baselines)
        run: npm run test:visual

      - name: Upload diff on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-018-diff
          path: test-results/
          retention-days: 3
