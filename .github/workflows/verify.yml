name: Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    # Pinned to a specific image, not `ubuntu-latest` — a periodic runner
    # image bump changes fontconfig/freetype and silently invalidates every
    # committed visual-regression baseline with no code change on our side.
    # See .vibe/decisions/015-visual-regression-shared-preset-shape.md.
    #
    # This is the single source of truth for the real-runner test/lint/
    # visual-regression check: both the push/PR-triggered `ci.yml` and the
    # tag-triggered `release.yml` call this same reusable workflow, so the
    # two can never drift into checking something different. See backlog
    # item 022 /
    # .vibe/decisions/021-real-runner-check-via-reusable-workflow-not-branch-protection.md.
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to a commit SHA, not a floating tag — an
      # upstream action update must never be able to silently change what
      # runs here.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npx biome check .

      # Keyed on the pinned @playwright/test version (package-lock.json) so
      # a version bump busts the cache instead of silently reusing a
      # mismatched browser build.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # This is the check backlog item 022 exists to move earlier: run from
      # every caller (ci.yml on every push/PR, release.yml on every tag),
      # not only discovered when release.yml alone ran it after a version
      # was already tagged.
      - name: Visual regression tests
        run: npm run test:visual

      - name: Upload visual regression diff
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-diff
          path: test-results/
          retention-days: 14
