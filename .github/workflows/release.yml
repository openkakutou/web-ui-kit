name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required both for `npm publish --provenance` and for npm Trusted
      # Publishing (OIDC-based) — no NPM_TOKEN secret exists in this repo
      # at all; npm exchanges this job's GitHub identity token for a
      # short-lived publish grant instead. See
      # .vibe/decisions/002-publish-pipeline-safety-gates.md and
      # .vibe/decisions/003-npm-trusted-publishing-over-token.md.
      id-token: write
    steps:
      # Actions are pinned to a commit SHA, not a floating tag — this
      # workflow still publishes a real package on npmjs.org, and an
      # upstream action update must never be able to silently change what
      # runs here.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Trusted Publishing needs a recent npm CLI (OIDC support) — don't
      # rely on whatever version happens to ship with the Node.js version
      # above.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Test
        run: npm test

      - name: Lint
        run: npx biome check .

      - name: Build
        run: npm run build

      - name: Check tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag v$tag_version does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Verify packed file list
        run: npm run verify-pack

      - name: Pack tarball
        run: npm pack

      - name: Smoke build a fresh Vite app against the packed tarball
        run: |
          cd smoke
          npm install
          npm install "$(ls ../openkakutou-*.tgz)"
          npm run build

      - name: Publish to npmjs.org
        # No token: authenticated via npm Trusted Publishing (OIDC),
        # configured on npmjs.org for this exact repo + workflow file.
        run: npm publish --provenance
