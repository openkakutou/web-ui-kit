name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for `npm publish --provenance` (OIDC-based supply-chain
      # attestation) — see .vibe/decisions/002-publish-pipeline-safety-gates.md.
      id-token: write
    steps:
      # Actions are pinned to a commit SHA, not a floating tag, since this
      # workflow handles a publish-capable secret (NPM_TOKEN) — an upstream
      # action update must never be able to silently exfiltrate it.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npx biome check .

      - name: Build
        run: npm run build

      - name: Check tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag v$tag_version does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Verify packed file list
        run: npm run verify-pack

      - name: Pack tarball
        run: npm pack

      - name: Smoke build a fresh Vite app against the packed tarball
        run: |
          cd smoke
          npm install
          npm install "../$(ls ../openkakutou-*.tgz)"
          npm run build

      - name: Publish to npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance
